<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>MCP + LM Studio 핵심 로직 (v0)</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #1e1e1e; color: #d4d4d4; }
    input, button, textarea { font-family: monospace; padding: 8px; margin: 4px 0; background: #2d2d2d; color: #fff; border: 1px solid #444; border-radius: 4px; }
    button { cursor: pointer; background: #0e639c; }
    button:hover { background: #1177bb; }
    #logBox { width: 100%; height: 420px; background: #181818; color: #9cdcfe; border: 1px solid #333; padding: 10px; overflow-y: scroll; white-space: pre-wrap; font-size: 13px; }
    .highlight { color: #4ec9b0; }
    .warn { color: #ce9178; }
    .err { color: #f48771; }
  </style>
</head>
<body>

  <h2>🔬 MCP + LM Studio Tool-Calling 핵심 로직 (v0)</h2>
  <p>이 코드는 UI 요소를 배제하고 <b>MCP HTTP 세션 통신</b>과 <b>LLM 도구 호출 루프(Agent Loop)</b>의 핵심 알고리즘만 직관적으로 작성된 최소 예제입니다.</p>

  <div>
    <label>LM Studio URL:</label>
    <input type="text" id="llmUrl" value="http://192.168.45.183:1234" size="30" />
    <label>Model:</label>
    <input type="text" id="modelName" value="gemma4" size="15" /><br/>

    <label>MCP Server URL:</label>
    <input type="text" id="mcpUrl" value="http://127.0.0.1:8002/mcp" size="30" />
    <button onclick="initMcp()">1. MCP 연결 & 도구 조회</button>
  </div>

  <div style="margin-top: 15px;">
    <input type="text" id="userMsg" value="지금 사용할 수 있는 도구가 뭐가 있어? 또는 특정 작업을 실행해줘." style="width: 70%;" />
    <button onclick="sendMessage()">2. 질문 전송 (Agent 실행)</button>
  </div>

  <div style="margin-top: 15px;">
    <strong>실행 로그 (Console Output):</strong>
    <div id="logBox"></div>
  </div>

  <!-- ================================================================= -->
  <!-- 핵심 로직 JavaScript                                              -->
  <!-- ================================================================= -->
  <script>
    // -------------------------------------------------------------
    // [1] 전역 상태 관리 (State)
    // -------------------------------------------------------------
    const config = {
      mcpSessionId: null,   // MCP 서버가 발급하는 세션 ID (헤더 mcp-session-id)
      mcpTools: [],         // MCP 서버에서 가져온 도구 원본 목록
      messages: [],         // OpenAI 호환 대화 히스토리 [{role, content, ...}]
      jsonRpcId: 0          // JSON-RPC 요청 ID
    };

    // 로그 출력 헬퍼 함수
    function log(msg, className = '') {
      const box = document.getElementById('logBox');
      const time = new Date().toLocaleTimeString();
      const div = document.createElement('div');
      if (className) div.className = className;
      div.textContent = `[${time}] ${msg}`;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
      console.log(`[${time}] ${msg}`);
    }

    // -------------------------------------------------------------
    // [2] MCP JSON-RPC 통신 전송 함수 (Streamable HTTP Transport)
    // -------------------------------------------------------------
    async function sendMcpRpc(method, params = {}, isNotification = false) {
      const url = document.getElementById('mcpUrl').value.trim();
      const rpcId = isNotification ? undefined : ++config.jsonRpcId;

      // 1. JSON-RPC 2.0 규격 페이로드 생성
      const payload = {
        jsonrpc: "2.0",
        method: method,
        params: params
      };
      if (!isNotification) payload.id = rpcId;

      // 2. HTTP 헤더 설정 (발급받은 세션 ID가 있으면 헤더에 추가 필수!)
      const headers = {
        "Content-Type": "application/json",
        "Accept": "application/json, text/event-stream"
      };
      if (config.mcpSessionId) {
        headers["mcp-session-id"] = config.mcpSessionId;
      }

      log(`📡 MCP 요청 -> method: ${method} ${config.mcpSessionId ? `(Session: ${config.mcpSessionId.slice(0, 8)}...)` : ''}`);

      const response = await fetch(url, {
        method: "POST",
        headers: headers,
        body: JSON.stringify(payload)
      });

      // 3. 서버 응답 헤더에서 세션 ID 추출하여 저장 (FastMCP / Starlette MCP 규격)
      const sid = response.headers.get("mcp-session-id") || response.headers.get("Mcp-Session-Id");
      if (sid) {
        config.mcpSessionId = sid;
      }

      if (!response.ok) {
        const errText = await response.text();
        throw new Error(`MCP HTTP 에러 (${response.status}): ${errText}`);
      }

      if (isNotification || response.status === 204) return null;

      // 4. 응답 파싱 (SSE 스트림 형식 또는 일반 JSON 형식 대응)
      const contentType = response.headers.get("content-type") || "";
      if (contentType.includes("text/event-stream")) {
        const rawText = await response.text();
        for (const line of rawText.split('\n')) {
          if (line.startsWith("data: ")) {
            const data = JSON.parse(line.slice(6));
            if (data.error) throw new Error(data.error.message || JSON.stringify(data.error));
            if (data.result) return data.result;
          }
        }
        return null;
      } else {
        const data = await response.json();
        if (data.error) throw new Error(data.error.message || JSON.stringify(data.error));
        return data.result;
      }
    }

    // -------------------------------------------------------------
    // [3] MCP 서버 초기화 및 도구 목록 조회 (Initialize & ListTools)
    // -------------------------------------------------------------
    async function initMcp() {
      try {
        log("=== [MCP 초기화 시작] ===");
        config.mcpSessionId = null; // 초기화 시 세션 리셋

        // Step A: initialize (핸드셰이크 -> 서버가 mcp-session-id 발급)
        const initResult = await sendMcpRpc("initialize", {
          protocolVersion: "2024-11-05",
          capabilities: {},
          clientInfo: { name: "v0-core-client", version: "1.0.0" }
        });
        log(`✓ MCP Handshake 완료: ${JSON.stringify(initResult?.serverInfo || {})}`, 'highlight');

        // Step B: notifications/initialized (초기화 완료 알림 전송)
        await sendMcpRpc("notifications/initialized", {}, true);

        // Step C: tools/list (사용 가능한 도구 목록 요청)
        const listResult = await sendMcpRpc("tools/list", {});
        config.mcpTools = listResult?.tools || [];

        log(`✓ 로드된 도구 목록 (${config.mcpTools.length}개): ${config.mcpTools.map(t => t.name).join(', ')}`, 'highlight');
      } catch (err) {
        log(`❌ MCP 연결 실패: ${err.message}`, 'err');
      }
    }

    // -------------------------------------------------------------
    // [4] MCP 도구 포맷 -> OpenAI Function Calling 포맷 변환
    // -------------------------------------------------------------
    function convertMcpToOpenAiTools(mcpTools) {
      if (!mcpTools || mcpTools.length === 0) return undefined;
      return mcpTools.map(tool => ({
        type: "function",
        function: {
          name: tool.name,
          description: tool.description || "",
          parameters: tool.inputSchema || { type: "object", properties: {} }
        }
      }));
    }

    // -------------------------------------------------------------
    // [5] 에이전트 루프 (Agentic Tool Calling Loop)
    // -------------------------------------------------------------
    async function sendMessage() {
      const userText = document.getElementById('userMsg').value.trim();
      if (!userText) return;

      const llmUrl = document.getElementById('llmUrl').value.trim().replace(/\/+$/, '');
      const model = document.getElementById('modelName').value.trim();

      // 1. 사용자 질문을 대화 이력에 추가
      config.messages.push({ role: "user", content: userText });
      log(`\n👤 [사용자 질문]: ${userText}`);

      // 2. 도구 스키마 변환
      const openAiTools = convertMcpToOpenAiTools(config.mcpTools);
      const maxIterations = 5; // 무한 루프 방지용 최대 실행 횟수
      let iteration = 0;

      while (iteration < maxIterations) {
        iteration++;
        log(`🤖 LM Studio(${model}) 호출 중... (Step ${iteration})`);

        // 3. LM Studio에 대화 이력 및 도구 목록 전달
        const response = await fetch(`${llmUrl}/v1/chat/completions`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            model: model,
            messages: config.messages,
            tools: openAiTools,
            tool_choice: openAiTools ? "auto" : undefined,
            temperature: 0.7
          })
        });

        if (!response.ok) {
          const err = await response.text();
          log(`❌ LM Studio 호출 에러: ${err}`, 'err');
          return;
        }

        const completion = await response.json();
        const assistantMessage = completion.choices[0].message;

        // 4. 모델이 도구 호출(tool_calls)을 요청했는지 검사
        if (assistantMessage.tool_calls && assistantMessage.tool_calls.length > 0) {
          log(`⚙️ 모델이 도구 호출을 결정했습니다 (${assistantMessage.tool_calls.length}건)`, 'warn');
          
          // (a) 모델의 tool_calls 메시지를 대화 이력에 보관
          config.messages.push(assistantMessage);

          // (b) 각 도구를 MCP 서버에 실제 실행
          for (const call of assistantMessage.tool_calls) {
            const toolName = call.function.name;
            let toolArgs = {};
            try {
              toolArgs = JSON.parse(call.function.arguments || '{}');
            } catch (e) {
              toolArgs = {};
            }

            log(`🔧 [도구 실행] ${toolName}(${JSON.stringify(toolArgs)})`, 'warn');

            let toolResult;
            try {
              // MCP tools/call 실행
              toolResult = await sendMcpRpc("tools/call", {
                name: toolName,
                arguments: toolArgs
              });
            } catch (toolErr) {
              toolResult = { error: toolErr.message };
            }

            const resultString = typeof toolResult === 'string' ? toolResult : JSON.stringify(toolResult);
            log(`📥 [도구 결과]: ${resultString.slice(0, 200)}${resultString.length > 200 ? '...' : ''}`, 'highlight');

            // (c) 도구 실행 결과를 'tool' 역할 메시지로 대화 이력에 추가
            config.messages.push({
              role: "tool",
              tool_call_id: call.id,
              name: toolName,
              content: resultString
            });
          }

          // (d) 결과가 추가된 대화 이력을 가지고 다시 루프의 처음(LLM 호출)으로 돌아감
          continue;
        }

        // 5. 도구 호출이 없는 일반 텍스트 응답이면 최종 완료
        const finalAnswer = assistantMessage.content || "";
        config.messages.push({ role: "assistant", content: finalAnswer });
        log(`\n💡 [최종 답변]:\n${finalAnswer}\n`, 'highlight');
        break;
      }
    }
  </script>
</body>
</html>
